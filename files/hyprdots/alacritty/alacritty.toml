# Alacritty 终端配置：ArchDevKit 默认终端之一。
# 字体、配色和窗口边距都在这里调整；启动命令由 ~/.local/bin/archdevkit-terminal 统一选择。
[env]
TERM = "xterm-256color"

# 窗口交给 Hyprland 管理装饰，因此这里关闭原生标题栏。
[window]
padding = { x = 10, y = 10 }
decorations = "None"
opacity = 1.0

# Nerd Font 用于显示图标、Powerline 提示符和部分 TUI 符号。
[font]
size = 12.5

[font.normal]
family = "JetBrainsMono Nerd Font Mono"
style = "Regular"

[font.bold]
family = "JetBrainsMono Nerd Font Mono"
style = "Bold"

[font.italic]
family = "JetBrainsMono Nerd Font Mono"
style = "Italic"

[colors.primary]
background = "#232634"
foreground = "#f0f3ff"

# 以下颜色为 ArchDevKit Clear Mocha 风格，影响 ANSI 终端颜色。
[colors.cursor]
text = "#232634"
cursor = "#8AADF4"

[colors.selection]
text = "#F0F3FF"
background = "#4A5068"

[colors.normal]
black = "#4a5068"
red = "#e78284"
green = "#a6d189"
yellow = "#e5c890"
blue = "#8aadf4"
magenta = "#ca9ee6"
cyan = "#81c8be"
white = "#c7cce2"

[colors.bright]
black = "#596079"
red = "#e78284"
green = "#a6d189"
yellow = "#e5c890"
blue = "#8aadf4"
magenta = "#ca9ee6"
cyan = "#81c8be"
white = "#c7cce2"
