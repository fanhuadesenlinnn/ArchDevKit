# Alacritty 终端配置：ArchDevKit 默认终端之一。
# 字体、配色和窗口边距都在这里调整；启动命令由 ~/.local/bin/archdevkit-terminal 统一选择。
[env]
TERM = "xterm-256color"

# 窗口交给 Hyprland 管理装饰，因此这里关闭原生标题栏。
[window]
padding = { x = 10, y = 10 }
decorations = "None"
opacity = 1.0

# 默认使用 Monaco，与系统 UI 字体保持一致；中文和 Emoji 由 fontconfig 回退到 Noto。
[font]
size = 12.5

[font.normal]
family = "Monaco"
style = "Regular"

[font.bold]
family = "Monaco"
style = "Regular"

[font.italic]
family = "Monaco"
style = "Regular"

[colors.primary]
background = "#1C1C1C"
foreground = "#F8F8F2"

# 以下颜色为 ArchDevKit i3 Clear 风格，影响 ANSI 终端颜色。
[colors.cursor]
text = "#1C1C1C"
cursor = "#81A2BE"

[colors.selection]
text = "#F8F8F2"
background = "#44475A"

[colors.normal]
black = "#282A36"
red = "#FF5555"
green = "#50FA7B"
yellow = "#F1FA8C"
blue = "#81A2BE"
magenta = "#BB86FC"
cyan = "#57C7FF"
white = "#C5C8C6"

[colors.bright]
black = "#44475A"
red = "#FF6E6E"
green = "#69FF94"
yellow = "#FFFFA5"
blue = "#9CC4E4"
magenta = "#D6ACFF"
cyan = "#8BE9FD"
white = "#F8F8F2"
