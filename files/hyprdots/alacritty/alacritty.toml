# Alacritty 终端配置：ArchDevKit 默认终端之一。
# 字体、配色和窗口边距都在这里调整；启动命令由 ~/.local/bin/archdevkit-terminal 统一选择。
[env]
TERM = "xterm-256color"

# 窗口交给 Hyprland 管理装饰，因此这里关闭原生标题栏。
[window]
padding = { x = 10, y = 10 }
decorations = "None"
opacity = 1.0

# Nerd Font 用于显示图标、Powerline 提示符和部分 TUI 符号。
[font]
size = 12.0

[font.normal]
family = "IosevkaTerm Nerd Font Mono"
style = "Regular"

[font.bold]
family = "IosevkaTerm Nerd Font Mono"
style = "Bold"

[font.italic]
family = "IosevkaTerm Nerd Font Mono"
style = "Italic"

[colors.primary]
background = "#11111B"
foreground = "#CDD6F4"

# 以下颜色为 Catppuccin Mocha 风格，影响 ANSI 终端颜色。
[colors.cursor]
text = "#11111B"
cursor = "#F5E0DC"

[colors.selection]
text = "#11111B"
background = "#F5E0DC"

[colors.normal]
black = "#45475A"
red = "#F38BA8"
green = "#A6E3A1"
yellow = "#F9E2AF"
blue = "#89B4FA"
magenta = "#F5C2E7"
cyan = "#94E2D5"
white = "#BAC2DE"

[colors.bright]
black = "#585B70"
red = "#F38BA8"
green = "#A6E3A1"
yellow = "#F9E2AF"
blue = "#89B4FA"
magenta = "#F5C2E7"
cyan = "#94E2D5"
white = "#A6ADC8"
